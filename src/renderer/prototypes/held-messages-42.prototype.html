<!DOCTYPE html>
<!-- ============================================================
  PROTOTYPE — THROWAWAY — issue #42 (held cross-session messages UX)
  Three variants of "where do HELD messages surface and how does a
  human release/refuse one", switchable via ?variant=A|B|C or ←/→.
  Self-contained mock of the structured view (real app CSS not linked
  on purpose: double-click-to-run beats pixel fidelity here).
  Do NOT ship any of this — fold the winning IDEA into StructuredView.
============================================================ -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PROTO #42 — held messages</title>
<style>
  :root {
    --bg: #0b0c0f; --bg-2: #121418; --bg-3: #1a1d23; --border: #262a33;
    --text: #d8dce3; --text-dim: #8b93a1; --text-faint: #5c6470;
    --accent: #6ea8ff; --amber: #ffc857; --amber-dim: rgba(255,200,87,.12);
    --green: #5bd68b; --red: #ff7a7a; --user-bubble: #1d2634;
    font-size: 14px;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family: Inter, system-ui, sans-serif; height:100vh; display:flex; overflow:hidden; }

  /* ---- mock sidebar (only variant C makes it interesting) ---- */
  .sidebar { width:230px; background:var(--bg-2); border-right:1px solid var(--border);
             padding:10px 8px; flex-shrink:0; }
  .ws-row { display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:6px;
            font-size:12.5px; color:var(--text-dim); cursor:default; }
  .ws-row.active { background:var(--bg-3); color:var(--text); }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex-shrink:0; }
  .dot.green { background:var(--green); }
  .held-badge { margin-left:auto; background:var(--amber-dim); color:var(--amber);
                border:1px solid rgba(255,200,87,.4); border-radius:999px; font-size:10px;
                padding:0 6px; height:16px; display:inline-flex; align-items:center; gap:3px;
                cursor:pointer; }
  .sidebar h4 { font-size:10px; text-transform:uppercase; letter-spacing:.6px;
                color:var(--text-faint); margin:8px 6px 4px; }

  /* ---- pane ---- */
  .pane { flex:1; display:flex; flex-direction:column; min-width:0; }
  .pane-head { padding:9px 16px; border-bottom:1px solid var(--border); font-size:13px;
               display:flex; align-items:center; gap:8px; color:var(--text-dim); background:var(--bg-2); }
  .pane-head b { color:var(--text); font-weight:600; }
  .transcript { flex:1; overflow-y:auto; padding:18px 22px 8px; display:flex;
                flex-direction:column; gap:14px; }

  .msg-user { align-self:flex-end; max-width:70%; background:var(--user-bubble);
              border-radius:12px 12px 4px 12px; padding:9px 13px; font-size:13.5px; }
  .msg-agent { max-width:78%; font-size:13.5px; line-height:1.55; }
  .tool-card { border:1px solid var(--border); background:var(--bg-2); border-radius:8px;
               padding:7px 11px; font-size:12px; color:var(--text-dim); max-width:70%;
               font-family: ui-monospace, monospace; }
  .peer-row { color:var(--text-faint); font-size:12px; cursor:default; }
  .peer-row .chev { margin-right:5px; }

  /* held visuals shared */
  .held-actions { display:inline-flex; gap:6px; margin-left:10px; }
  .btn { border:1px solid var(--border); background:var(--bg-3); color:var(--text-dim);
         border-radius:6px; font-size:11px; padding:2px 9px; cursor:pointer; }
  .btn:hover { color:var(--text); border-color:var(--text-faint); }
  .btn.release { color:var(--green); border-color: rgba(91,214,139,.4); }
  .btn.refuse { color:var(--red); border-color: rgba(255,122,122,.35); }

  /* ---- Variant A: composer tray ---- */
  .composer-zone { border-top:1px solid var(--border); background:var(--bg-2); padding:10px 16px 14px; }
  .tray-chip { display:inline-flex; align-items:center; gap:7px; background:var(--amber-dim);
               border:1px solid rgba(255,200,87,.4); color:var(--amber); border-radius:999px;
               padding:3px 12px; font-size:12px; cursor:pointer; margin-bottom:9px; }
  .tray-list { border:1px solid rgba(255,200,87,.35); border-radius:10px; background:var(--bg-3);
               margin-bottom:10px; overflow:hidden; }
  .tray-head { display:flex; align-items:center; padding:7px 12px; font-size:11.5px;
               color:var(--amber); border-bottom:1px solid var(--border); gap:8px; }
  .tray-head .spacer { flex:1; }
  .tray-item { display:flex; align-items:baseline; gap:9px; padding:8px 12px;
               border-bottom:1px solid var(--border); font-size:12.5px; }
  .tray-item:last-child { border-bottom:none; }
  .tray-item .from { color:var(--accent); font-weight:600; white-space:nowrap; font-size:11.5px; }
  .tray-item .prev { color:var(--text-dim); overflow:hidden; text-overflow:ellipsis;
                     white-space:nowrap; flex:1; }
  .composer { display:flex; align-items:center; border:1px solid var(--border); border-radius:10px;
              background:var(--bg); padding:10px 14px; color:var(--text-faint); font-size:13px; }

  /* ---- Variant B: inline held rows ---- */
  .held-inline { border-left:3px solid var(--amber); background:var(--amber-dim);
                 border-radius:6px; padding:7px 12px; font-size:12.5px; max-width:82%; }
  .held-inline .tag { color:var(--amber); font-size:10.5px; font-weight:700;
                      text-transform:uppercase; letter-spacing:.5px; margin-right:8px; }
  .held-inline .from { color:var(--accent); font-weight:600; margin-right:6px; }
  .held-inline .body { color:var(--text-dim); }

  /* ---- Variant C: slide-over panel ---- */
  .slideover { position:fixed; right:0; top:0; bottom:0; width:340px; background:var(--bg-2);
               border-left:1px solid var(--border); box-shadow:-12px 0 30px rgba(0,0,0,.45);
               display:flex; flex-direction:column; z-index:40; }
  .slideover h3 { margin:0; padding:14px 16px; font-size:13px; border-bottom:1px solid var(--border);
                  display:flex; align-items:center; gap:8px; }
  .slide-item { padding:11px 16px; border-bottom:1px solid var(--border); font-size:12.5px; }
  .slide-item .meta { display:flex; gap:8px; align-items:center; margin-bottom:5px; }
  .slide-item .from { color:var(--accent); font-weight:600; font-size:11.5px; }
  .slide-item .ws { color:var(--text-faint); font-size:10.5px; }
  .slide-item .body { color:var(--text-dim); line-height:1.45; margin-bottom:7px; }
  .slide-foot { margin-top:auto; padding:12px 16px; border-top:1px solid var(--border);
                display:flex; gap:8px; }

  /* ---- state readout + switcher ---- */
  .state-readout { position:fixed; top:10px; right:12px; z-index:60; background:var(--bg-3);
                   border:1px solid var(--border); border-radius:8px; padding:5px 11px;
                   font-size:11px; color:var(--text-dim); font-family:ui-monospace,monospace; }
  .switcher { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:60;
              display:flex; align-items:center; gap:12px; background:#fff; color:#111;
              border-radius:999px; padding:7px 16px; font-size:13px; font-weight:600;
              box-shadow:0 6px 24px rgba(0,0,0,.5); }
  .switcher button { border:none; background:none; font-size:15px; cursor:pointer; padding:0 4px; }
  .proto-banner { position:fixed; top:10px; left:12px; z-index:60; font-size:10px; color:var(--red);
                  border:1px dashed var(--red); border-radius:6px; padding:3px 8px; opacity:.8; }
</style>
</head>
<body>
<div class="proto-banner">PROTOTYPE #42 — jetable</div>
<div class="state-readout" id="readout"></div>
<div id="app" style="display:flex; flex:1; min-width:0;"></div>

<div class="switcher">
  <button id="prev">←</button>
  <span id="vlabel"></span>
  <button id="next">→</button>
</div>

<script>
/* ------- shared fake data (realistic fleet traffic) ------- */
const HELD_INIT = [
  { id:'h1', from:'ops-fix-wave-5', ws:'sdk-feature-audit', at:'09:41',
    text:"DIGEST: vague spawned — 4 implémenteurs + verifier en place, ledger #61 ouvert." },
  { id:'h2', from:'bloc2-mc-next-migration-poc', ws:'sdk-feature-audit', at:'09:52',
    text:"nmc-306: livrables commités+pushés sur sa branche, ls-remote OK — workspace supprimable." },
  { id:'h3', from:'watch-tech-pr-review-requests', ws:'sdk-feature-audit', at:'10:07',
    text:"2 nouvelles review requests sur metarepo: #1502 (vecna), #1507 (next-api)." },
];
let held = [...HELD_INIT];
let released = [], refused = [];

const TRANSCRIPT = [
  { k:'user',  h:"Reprenons le travail — lance la vague 5." },
  { k:'agent', h:"Vague 5 lancée : OPS <b>ops-fix-wave-5</b> spawné et promu. Il monte le ledger puis la fleet (4 tickets : #57, #38, #59, #35)." },
  { k:'tool',  h:"$ orchestra spawn --task \"You are the OPS coordinator…\" → Spawned eadee48c" },
  { k:'peer',  h:"› 2 messages de bloc2-mc-next-migration-poc" },
  { k:'agent', h:"En attendant le premier digest, je prépare les choix UX de #42 avec toi." },
];

function esc(s){ return s; }
function transcriptHTML(extra){ // extra: fn(idx) -> html injected after row idx (variant B)
  let out = '';
  TRANSCRIPT.forEach((m,i)=>{
    if (m.k==='user') out += `<div class="msg-user">${m.h}</div>`;
    if (m.k==='agent') out += `<div class="msg-agent">${m.h}</div>`;
    if (m.k==='tool') out += `<div class="tool-card">${m.h}</div>`;
    if (m.k==='peer') out += `<div class="peer-row"><span class="chev">›</span>${m.h.replace('› ','')}</div>`;
    if (extra) out += extra(i);
  });
  return out;
}
function actionsHTML(id){
  return `<span class="held-actions">
    <button class="btn release" onclick="release('${id}')">Release ▶</button>
    <button class="btn refuse" onclick="refuse('${id}')">Refuser ✕</button></span>`;
}
function release(id){ const m = held.find(x=>x.id===id); if(!m) return;
  held = held.filter(x=>x.id!==id); released.push(m); render(); }
function refuse(id){ const m = held.find(x=>x.id===id); if(!m) return;
  held = held.filter(x=>x.id!==id); refused.push(m); render(); }
function releaseAll(){ released.push(...held); held=[]; render(); }
function resetState(){ held=[...HELD_INIT]; released=[]; refused=[]; render(); }

function sidebarHTML(withBadges){
  const badge = n => withBadges && n>0
    ? `<span class="held-badge" onclick="void 0">✉ ${n}</span>` : '';
  return `<div class="sidebar">
    <h4>Orchestra</h4>
    <div class="ws-row active"><span class="dot green"></span>sdk-feature-audit ${badge(held.length)}</div>
    <div class="ws-row"><span class="dot green"></span>ops-fix-wave-5</div>
    <div class="ws-row"><span class="dot"></span>bloc2-mc-next-migration-poc ${badge(withBadges?1:0)}</div>
    <div class="ws-row"><span class="dot"></span>watch-tech-pr-review-requests</div>
  </div>`;
}
function paneHead(){ return `<div class="pane-head"><b>sdk-feature-audit</b> · vue structurée · 712k</div>`; }
function composerHTML(inner){ return `<div class="composer-zone">${inner??''}
  <div class="composer">Écris un message… <span style="margin-left:auto">⏎</span></div></div>`; }

/* ================= VARIANT A — tray au-dessus du composer ================= */
function variantA(){
  const items = held.map(m=>`<div class="tray-item">
      <span class="from">${m.from}</span><span class="prev">${m.text}</span>${actionsHTML(m.id)}
    </div>`).join('');
  const tray = held.length===0
    ? `<div class="tray-chip" style="opacity:.5">✉ aucun message en attente</div>`
    : `<div class="tray-list">
        <div class="tray-head">✉ ${held.length} message${held.length>1?'s':''} held — parqués sans tour payé
          <span class="spacer"></span>
          <button class="btn release" onclick="releaseAll()">Tout release</button></div>
        ${items}</div>`;
  return sidebarHTML(false) + `<div class="pane">${paneHead()}
    <div class="transcript">${transcriptHTML()}</div>
    ${composerHTML(tray)}</div>`;
}

/* ================= VARIANT B — lignes held inline dans le fil ================= */
function variantB(){
  // held messages injected at their chronological arrival points
  const at = {1:'h1', 3:'h2', 4:'h3'};
  const extra = i => {
    const id = at[i]; if(!id) return '';
    const m = held.find(x=>x.id===id); if(!m) return '';
    return `<div class="held-inline"><span class="tag">✉ held ${m.at}</span>
      <span class="from">${m.from}</span><span class="body">${m.text}</span>${actionsHTML(m.id)}</div>`;
  };
  return sidebarHTML(false) + `<div class="pane">${paneHead()}
    <div class="transcript">${transcriptHTML(extra)}</div>
    ${composerHTML()}</div>`;
}

/* ================= VARIANT C — badge sidebar + panneau latéral ================= */
function variantC(){
  const items = held.map(m=>`<div class="slide-item">
      <div class="meta"><span class="from">${m.from}</span><span class="ws">→ ${m.ws} · ${m.at}</span></div>
      <div class="body">${m.text}</div>
      <button class="btn release" onclick="release('${m.id}')">Release ▶</button>
      <button class="btn refuse" onclick="refuse('${m.id}')">Refuser ✕</button>
    </div>`).join('');
  const panel = `<div class="slideover">
    <h3>✉ Messages held <span style="color:var(--text-faint);font-weight:400">· toute la fleet</span></h3>
    ${held.length? items : '<div class="slide-item" style="color:var(--text-faint)">Rien en attente 🎉</div>'}
    <div class="slide-foot">
      <button class="btn release" onclick="releaseAll()">Tout release</button>
      <button class="btn" onclick="resetState()">Reset proto</button>
    </div></div>`;
  return sidebarHTML(true) + `<div class="pane">${paneHead()}
    <div class="transcript">${transcriptHTML()}</div>
    ${composerHTML()}</div>` + panel;
}

/* ================= switcher plumbing ================= */
const VARIANTS = {
  A: { name:'Tray composer', fn: variantA },
  B: { name:'Inline transcript', fn: variantB },
  C: { name:'Badge sidebar + panneau', fn: variantC },
};
const KEYS = Object.keys(VARIANTS);
function current(){ const v = new URLSearchParams(location.search).get('variant');
  return KEYS.includes(v) ? v : 'A'; }
function go(v){ const u = new URL(location); u.searchParams.set('variant', v);
  history.replaceState(null,'',u); render(); }
function cycle(d){ const i = KEYS.indexOf(current()); go(KEYS[(i+d+KEYS.length)%KEYS.length]); }
function render(){
  const v = current();
  document.getElementById('app').innerHTML = VARIANTS[v].fn();
  document.getElementById('vlabel').textContent = `${v} (${VARIANTS[v].name})`;
  document.getElementById('readout').textContent =
    `held:${held.length} released:${released.length} refused:${refused.length}`;
}
document.getElementById('prev').onclick = ()=>cycle(-1);
document.getElementById('next').onclick = ()=>cycle(1);
document.addEventListener('keydown', e=>{
  if (/input|textarea/i.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key==='ArrowLeft') cycle(-1);
  if (e.key==='ArrowRight') cycle(1);
});
render();
</script>
</body>
</html>
