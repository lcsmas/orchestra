<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in</title></head>
<body>
<h1>Sign in</h1>
<label>Email <input id="email" type="text" required></label>
<button type="button" id="signin">Sign in</button>
<div id="slot"></div>
<script>
// the welcome line appears 600 ms AFTER the click: a flow that does not wait for it reads nothing
document.getElementById('signin').addEventListener('click', function () {
  var email = document.getElementById('email').value;
  setTimeout(function () { var d = document.createElement('div'); d.id = 'welcome'; d.textContent = 'Welcome, ' + email; document.getElementById('slot').appendChild(d); }, 600);
});
</script>
</body></html>
