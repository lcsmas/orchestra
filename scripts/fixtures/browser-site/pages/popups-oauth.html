<!doctype html>
<html><head><meta charset="utf-8"><title>OAuth popup fixture</title>
<style>html,body{margin:0;height:100%;background:#7a2ca0;color:#fff;font:700 22px sans-serif}div{padding:24px}</style></head>
<body><div id="who">oauth popup</div><div id="opener">opener: ?</div>
<script>
// The IdP page: report the sign-in to window.opener, then close (unless ?state=hold keeps it up for inspection).
const state = new URLSearchParams(location.search).get('state') || 'auto';
const hasOpener = !!window.opener;
document.getElementById('opener').textContent = 'opener: ' + (hasOpener ? 'yes' : 'no');
// A cookie set HERE must be visible to the opener: both live in the workspace's session partition.
const sid = state + '-' + Math.random().toString(16).slice(2, 10);
document.cookie = 'popup_sid=' + sid + '; path=/';
if (hasOpener) {
  window.opener.postMessage({ type: 'oauth', token: 'tok-' + state, sid }, location.origin);
  if (state !== 'hold') setTimeout(() => window.close(), 250);
}
</script>
</body></html>
