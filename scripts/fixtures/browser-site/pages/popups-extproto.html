<!doctype html>
<html><head><meta charset="utf-8"><title>Popups fixture extproto</title>
<style>html,body{margin:0;height:100%;background:#3a3a1a;color:#fff;font:600 18px sans-serif}a,button{position:absolute;left:20px;width:300px;height:44px;display:block;box-sizing:border-box;font:600 16px sans-serif;text-align:center;line-height:44px;border:0;background:#fff;color:#123;text-decoration:none;cursor:pointer}#ssh{top:20px}#zoom{top:84px}#mail{top:148px}#tel{top:212px}#openpop{top:276px}</style></head>
<body>
<!-- #396 review F-b: a LINK CLICK to an external protocol goes through Chromium's external-protocol path (xdg-open), not through window.open. -->
<a id="ssh" href="ssh://x/a">ssh link</a>
<a id="zoom" href="zoommtg://zoom.us/join?confno=1">zoommtg link</a>
<a id="mail" href="mailto:a@b.c">mailto link</a>
<a id="tel" href="tel:+33123456789">tel link</a>
<button id="openpop" onclick="window.open('popups-extproto.html?in=popup', 'extpop', 'width=480,height=360')">open this page in a popup window</button>
<script>
// ?nogesture=1 (seat-3 F1): the three ways a page can ask the OS to open mailto:/tel: WITHOUT any user click — none may launch anything.
if (location.search.includes('nogesture')) {
  setTimeout(function () { location.href = 'mailto:auto-load@x.y'; }, 500);                                                                  // a load-time navigation
  setTimeout(function () { var a = document.createElement('a'); a.href = 'tel:+999'; document.body.appendChild(a); a.click(); }, 900);   // a programmatic click
  setTimeout(function () { window.open('mailto:auto-open@x.y'); }, 1300);                                                                  // window.open
}
</script>
</body></html>
