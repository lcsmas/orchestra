<!doctype html>
<html><head><meta charset="utf-8"><title>Popups fixture hostile</title>
<style>html,body{margin:0;height:100%;background:#2a2a2a;color:#fff;font:600 18px sans-serif}button{position:absolute;left:20px;width:360px;height:44px;font:600 16px sans-serif}#go{top:20px}#goweb{top:84px}#out{position:absolute;left:20px;top:150px}</style></head>
<body>
<button id="go" onclick="hostile()">Open a popup with hostile features</button>
<button id="goweb" onclick="smuggle()">Open a popup with a webContents feature</button>
<div id="out">idle</div>
<script>
// A hostile page's window.open (#396 review F1): the features string tries to make a screen-covering, frameless, transparent, always-on-top, un-closable window,
// and (second button) to smuggle a `webContents` option over Electron's real guest handle. The built app must give a normal, bounded, floating child window — or refuse.
const FEATURES = 'width=4000,height=3000,x=0,y=0,alwaysOnTop,frame=no,transparent,fullscreen,kiosk,modal,closable=no,focusable=no';
function hostile() {
  const w = window.open('popups-oauth.html?state=hold', 'hostile', FEATURES);
  document.getElementById('out').textContent = w ? 'opened' : 'no-window';
}
function smuggle() {
  const w = window.open('popups-oauth.html?state=hold', 'smuggle', 'width=500,height=400,webContents=pwned');
  document.getElementById('out').textContent = w ? 'opened' : 'no-window';
}
</script>
</body></html>
