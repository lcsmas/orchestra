name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.1.17)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            artifact: Orchestra-x64.AppImage
          - os: ubuntu-24.04-arm
            arch: arm64
            artifact: Orchestra-arm64.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libfuse2
          pnpm install --frozen-lockfile

      - name: Rebuild native modules
        run: pnpm exec electron-rebuild

      - name: Build AppImage
        # `build:bundles` is the SAME script local `pnpm run build` uses (vite →
        # build:cli → build:keeper), so CI cannot silently ship without the
        # CLI/keeper bundles — that gap shipped every AppImage up to v0.5.221
        # without the session keeper. Share the script; never restate the list.
        #
        # electron-builder is invoked directly rather than through `pnpm run
        # build` so `--publish never` actually reaches its parser: `pnpm run
        # build -- --publish never` forwards a LITERAL `--` too (argv becomes
        # ["--","--publish","never"]), which the parser treats as a positional
        # and leaves `publish` undefined — and undefined is exactly what
        # triggers implicit publishing (PublishManager.js: git tag, then CI
        # detection), which then fails with "GitHub Personal Access Token is
        # not set". This job only builds + uploads artifacts; the `publish` job
        # creates the release.
        #
        # The disk preflight is invoked EXPLICITLY here (issue #87). Because
        # electron-builder is called directly rather than via `pnpm run build`
        # for the argv reason above, it does NOT inherit that script's
        # `build-package` guard — so without this line CI is unguarded at the
        # single step with the largest requirement (measured peak `release/` =
        # 2.158 GiB). `build:bundles` brings its own `prebuild:bundles` guard.
        run: |
          pnpm run build:bundles
          node scripts/disk-guard.cjs --preset build-package
          pnpm exec electron-builder --publish never

      - name: Rename artifact
        run: mv release/Orchestra.AppImage release/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # Creates release if it doesn't exist (--ci-only mode)
          # Appends to existing release if it does (manual mode)
          files: |
            artifacts/Orchestra-x64.AppImage/Orchestra-x64.AppImage
            artifacts/Orchestra-arm64.AppImage/Orchestra-arm64.AppImage
          fail_on_unmatched_files: true
          generate_release_notes: true
